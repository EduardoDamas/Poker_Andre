# Serve the single-page admin app. Any unknown path falls back to index.html
# so client-side routing works. $PORT is filled in by nginx's envsubst at start.
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets with long cache; HTML always revalidated.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
