# Local development infrastructure for CAPA CONTEST — Phase 1
# Postgres = source of truth for money (wallet ledger, ACID).
# Redis    = live game state, matchmaking, socket sessions.
#
# Usage:  docker compose up -d
#         docker compose down       (stops; keeps data in named volumes)
#         docker compose down -v     (DESTROYS data — dev only)

services:
  postgres:
    image: postgres:16-alpine
    container_name: capa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: capa
      POSTGRES_PASSWORD: capa_dev_password
      POSTGRES_DB: capa_contest
    ports:
      # Host 5434 -> container 5432 (5432/5433 were already in use on this machine).
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capa -d capa_contest"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: capa_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
