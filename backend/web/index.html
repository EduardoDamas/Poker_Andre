<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Replaced by `flutter build web --base-href /jogar/` (served by the backend at /jogar). -->
  <base href="/jogar/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CAPA CONTEST — torneios de habilidade de Poker. Jogue direto no navegador, no iPhone, no Android ou no computador.">
  <meta name="theme-color" content="#0A0A0B">

  <!-- iPhone: add to home screen like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CAPA CONTEST">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CAPA CONTEST</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0A0A0B; }
    /* Shown while the app downloads (a few seconds on a phone); the app covers it. */
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: Roboto, system-ui, -apple-system, Arial, sans-serif; color: #A7ABB4;
    }
    #loading .mark { font-weight: 900; font-style: italic; font-size: 32px; color: #F5F6F7; }
    #loading .mark span { color: #E2231A; }
    #loading .spin {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid #2A2B31; border-top-color: #E2231A; animation: s 0.9s linear infinite;
    }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="mark"><span>CAPA</span> CONTEST</div>
    <div class="spin"></div>
    <div>Carregando…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
