    <g transform="translate(0 240)"><rect width="1060" height="100" rx="18" fill="#171417" stroke="#6b4d53" stroke-width="2"/><circle cx="48" cy="50" r="25" fill="#22181b" stroke="#e2231a" stroke-width="3"/><text x="48" y="59" text-anchor="middle" class="h" font-size="22">3</text><text x="92" y="44" class="h" font-size="20">FOUR OF A KIND</text><text x="92" y="70" class="m" font-size="15">Four cards of the same rank</text><g transform="translate(650 18)"><rect width="58" height="64" rx="7" fill="url(#ivory)"/><text x="29" y="38" text-anchor="middle" class="ct" font-size="24" fill="#d8322b">Q♥</text><rect x="74" width="58" height="64" rx="7" fill="url(#ivory)"/><text x="103" y="38" text-anchor="middle" class="ct" font-size="24" fill="#14181f">Q♠</text><rect x="148" width="58" height="64" rx="7" fill="url(#ivory)"/><text x="177" y="38" text-anchor="middle" class="ct" font-size="24" fill="#1e8e5a">Q♣</text><rect x="222" width="58" height="64" rx="7" fill="url(#ivory)"/><text x="251" y="38" text-anchor="middle" class="ct" font-size="24" fill="#2a6fdb">Q♦</text><rect x="296" width="58" height="64" rx="7" fill="url(#ivory)"/><text x="325" y="38" text-anchor="middle" class="ct" font-size="24" fill="#14181f">2♠</text></g></g>
