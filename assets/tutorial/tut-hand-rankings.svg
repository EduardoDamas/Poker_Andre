<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <title>Texas Hold'em hand-ranking tutorial board</title>
  <desc>Original crimson and obsidian tutorial board showing the ten hand ranks with clear card examples.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171517"/><stop offset="1" stop-color="#070708"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4438"/><stop offset=".5" stop-color="#e2231a"/><stop offset="1" stop-color="#9e1009"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b1"/><stop offset=".5" stop-color="#f5c45e"/><stop offset="1" stop-color="#a66b1a"/></linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#e7e2d8"/></linearGradient>
    <style>.h{font-family:Inter,Arial,sans-serif;fill:#f5f6f7;font-weight:800;letter-spacing:1.2px}.m{font-family:Inter,Arial,sans-serif;fill:#a7abb4;font-weight:500;letter-spacing:.6px}.ct{font-family:Georgia,serif;font-weight:700}</style>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="1444" rx="28" fill="none" stroke="#3a3034" stroke-width="2"/>
  <text x="70" y="88" class="h" font-size="30">HAND RANKINGS</text>
  <text x="70" y="122" class="m" font-size="17">TEXAS HOLD'EM · BEST FIVE-CARD HAND WINS · EXAMPLE PIPS ARE LOCALIZABLE</text>
