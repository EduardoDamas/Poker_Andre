<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <title>Betting action tutorial</title>
  <desc>Six clear poker betting actions in the client crimson theme, arranged as an onboarding flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171517"/><stop offset="1" stop-color="#070708"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4438"/><stop offset=".5" stop-color="#e2231a"/><stop offset="1" stop-color="#9e1009"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b1"/><stop offset=".5" stop-color="#f5c45e"/><stop offset="1" stop-color="#a66b1a"/></linearGradient>
    <style>.h{font-family:Inter,Arial,sans-serif;fill:#f5f6f7;font-weight:800;letter-spacing:1.2px}.m{font-family:Inter,Arial,sans-serif;fill:#a7abb4;font-weight:500;letter-spacing:.7px}.b{font-family:Inter,Arial,sans-serif;font-weight:800;fill:#f5f6f7;letter-spacing:1px}</style>
  </defs>
  <rect width="1400" height="780" fill="url(#bg)"/>
  <rect x="30" y="30" width="1340" height="720" rx="30" fill="none" stroke="#3a3034" stroke-width="2"/>
  <text x="72" y="90" class="h" font-size="30">BETTING ACTIONS</text>
  <text x="72" y="124" class="m" font-size="17">TUTORIAL BOARD · ICON + SHAPE + LABEL KEEP ACTIONS LEGIBLE WITHOUT COLOR ALONE</text>
  <g transform="translate(72 198)">
    <g transform="translate(0 0)"><circle cx="90" cy="90" r="68" fill="#1c1719" stroke="#aeb4b7" stroke-width="4"/><path d="M62 94h56M74 79l18 15-18 15" fill="none" stroke="#f5f6f7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="190" text-anchor="middle" class="b" font-size="20">CHECK</text><text x="90" y="218" text-anchor="middle" class="m" font-size="14">pass the action</text></g>
    <path d="M192 90h70" stroke="#e2231a" stroke-width="4" stroke-dasharray="9 8"/><g transform="translate(272 0)"><circle cx="90" cy="90" r="68" fill="#2b0e12" stroke="#e2231a" stroke-width="5"/><circle cx="70" cy="90" r="20" fill="none" stroke="#ff4438" stroke-width="6"/><circle cx="110" cy="90" r="20" fill="none" stroke="#ff4438" stroke-width="6"/><path d="M90 90h20" stroke="#f5f6f7" stroke-width="5"/><text x="90" y="190" text-anchor="middle" class="b" font-size="20">CALL</text><text x="90" y="218" text-anchor="middle" class="m" font-size="14">match the bet</text></g>
    <path d="M464 90h70" stroke="#e2231a" stroke-width="4" stroke-dasharray="9 8"/><g transform="translate(544 0)"><circle cx="90" cy="90" r="68" fill="#2b0e12" stroke="#e2231a" stroke-width="5"/><circle cx="90" cy="111" r="20" fill="none" stroke="#ff4438" stroke-width="6"/><path d="M90 91V60M76 74l14-14 14 14" fill="none" stroke="#f5f6f7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="190" text-anchor="middle" class="b" font-size="20">BET</text><text x="90" y="218" text-anchor="middle" class="m" font-size="14">put chips forward</text></g>
    <path d="M736 90h70" stroke="#e2231a" stroke-width="4" stroke-dasharray="9 8"/><g transform="translate(816 0)"><circle cx="90" cy="90" r="68" fill="#2b0e12" stroke="#e2231a" stroke-width="5"/><circle cx="90" cy="116" r="17" fill="none" stroke="#ff4438" stroke-width="5"/><path d="M74 101V58M62 70l12-12 12 12M108 101V58M96 70l12-12 12 12" fill="none" stroke="#f5f6f7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="190" text-anchor="middle" class="b" font-size="20">RAISE</text><text x="90" y="218" text-anchor="middle" class="m" font-size="14">increase the bet</text></g>
    <path d="M1008 90h70" stroke="#e2231a" stroke-width="4" stroke-dasharray="9 8"/><g transform="translate(1088 0)"><circle cx="90" cy="90" r="68" fill="#2b0e12" stroke="#ff4438" stroke-width="5"/><rect x="59" y="58" width="36" height="36" fill="none" stroke="#f5f6f7" stroke-width="6"/><rect x="85" y="86" width="36" height="36" fill="none" stroke="#f5f6f7" stroke-width="6"/><path d="M94 94 86 86" stroke="#ff4438" stroke-width="5"/><text x="90" y="190" text-anchor="middle" class="b" font-size="20">FOLD</text><text x="90" y="218" text-anchor="middle" class="m" font-size="14">muck the hand</text></g>
    <g transform="translate(482 325)"><rect width="260" height="110" rx="55" fill="#21190f" stroke="url(#gold)" stroke-width="5"/><circle cx="78" cy="55" r="24" fill="none" stroke="#f5c45e" stroke-width="6"/><circle cx="126" cy="55" r="24" fill="none" stroke="#f5c45e" stroke-width="6"/><path d="M78 31V8M61 20 78 8l17 12M126 31V8M109 20l17-12 17 12" fill="none" stroke="#fff0b1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="62" text-anchor="middle" class="b" font-size="19" fill="#fbe4a8">ALL-IN</text></g>
  </g>
  <rect x="72" y="610" width="1256" height="72" rx="20" fill="#110f11" stroke="#3c292d"/><text x="700" y="655" text-anchor="middle" class="m" font-size="16">Keep amount fields, sliders, and confirmation copy outside these icon illustrations so they can localize cleanly.</text>
</svg>
