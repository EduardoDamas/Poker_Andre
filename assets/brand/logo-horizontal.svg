<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="512" viewBox="0 0 1500 512">
  <title>CAPA CONTEST horizontal logo lockup</title>
  <desc>Client supplied crimson and obsidian top-hat cape emblem with the approved wordmark and tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171517"/><stop offset="1" stop-color="#070708"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff4438"/><stop offset="1" stop-color="#9e1009"/></linearGradient>
    <style>
      .word{font-family:Inter,Arial,sans-serif;font-size:72px;font-weight:800;letter-spacing:2px;fill:#f5f6f7}
      .tag{font-family:Inter,Arial,sans-serif;font-size:25px;font-weight:500;letter-spacing:1px;fill:#a7abb4}
    </style>
  </defs>
  <rect width="1500" height="512" rx="34" fill="url(#bg)"/>
  <rect x="39" y="38" width="5" height="436" rx="2" fill="url(#red)"/>
  <image x="75" y="63" width="386" height="386" preserveAspectRatio="xMidYMid meet" xlink:href="logo.png"/>
  <text x="520" y="224" class="word">CAPA CONTEST</text>
  <text x="524" y="275" class="tag">TORNEIOS DIGITAIS DE CARTAS E TABULEIRO</text>
  <rect x="524" y="316" width="365" height="6" rx="3" fill="url(#red)"/>
</svg>
