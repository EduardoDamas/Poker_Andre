<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <title>Virtual chip denomination sheet</title>
  <desc>Eight original play-money chip denominations with consistent crimson, obsidian, silver and champagne styling. No currency symbols.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171517"/><stop offset="1" stop-color="#070708"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4438"/><stop offset=".5" stop-color="#e2231a"/><stop offset="1" stop-color="#9e1009"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f8fa"/><stop offset=".5" stop-color="#adb4b9"/><stop offset="1" stop-color="#565d62"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b1"/><stop offset=".5" stop-color="#f5c45e"/><stop offset="1" stop-color="#a96816"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feGaussianBlur stdDeviation="8"/></filter>
    <style>
      .h{font-family:Inter,Arial,sans-serif;fill:#f5f6f7;font-weight:800;letter-spacing:1.2px}
      .m{font-family:Inter,Arial,sans-serif;fill:#a7abb4;font-weight:500;letter-spacing:.7px}
      .v{font-family:Inter,Arial,sans-serif;fill:#f5f6f7;font-weight:900}
      .play{font-family:Inter,Arial,sans-serif;fill:#fbe4a8;font-weight:800;letter-spacing:1.4px}
    </style>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect x="30" y="30" width="1540" height="820" rx="30" fill="none" stroke="#3a3034" stroke-width="2"/>
  <text x="72" y="90" class="h" font-size="30">VIRTUAL CHIP DENOMINATIONS</text>
  <text x="72" y="124" class="m" font-size="17">CONSISTENT TOKEN GEOMETRY · VALUE BY NUMBER + EDGE STRIPE COUNT · PLAY TOKENS ONLY</text>
  <g transform="translate(158 198)">
    <!-- chip macro -->
    <g transform="translate(0 0)"><ellipse cx="105" cy="231" rx="92" ry="22" fill="#000" opacity=".6" filter="url(#shadow)"/><circle cx="105" cy="200" r="96" fill="#202126" stroke="#0a0a0b" stroke-width="15"/><circle cx="105" cy="200" r="79" fill="#3a4763" stroke="url(#silver)" stroke-width="5"/><circle cx="105" cy="200" r="56" fill="#141417" stroke="#aeb4b9" stroke-width="3"/><path d="M105 155a45 45 0 1 0 38 72" fill="none" stroke="#e2231a" stroke-width="10" stroke-linecap="round"/><text x="105" y="211" text-anchor="middle" class="v" font-size="26">5</text><text x="105" y="247" text-anchor="middle" class="play" font-size="11">PLAY</text><text x="105" y="326" text-anchor="middle" class="m" font-size="15">5 · 2 STRIPES</text></g>
    <g transform="translate(315 0)"><ellipse cx="105" cy="231" rx="92" ry="22" fill="#000" opacity=".6" filter="url(#shadow)"/><circle cx="105" cy="200" r="96" fill="#202126" stroke="#0a0a0b" stroke-width="15"/><circle cx="105" cy="200" r="79" fill="#201c21" stroke="url(#red)" stroke-width="7"/><path d="M42 154h126M42 246h126" stroke="#e2231a" stroke-width="8"/><circle cx="105" cy="200" r="56" fill="#141417" stroke="#ff4438" stroke-width="3"/><path d="M105 155a45 45 0 1 0 38 72" fill="none" stroke="#e2231a" stroke-width="10" stroke-linecap="round"/><text x="105" y="211" text-anchor="middle" class="v" font-size="25">25</text><text x="105" y="247" text-anchor="middle" class="play" font-size="11">PLAY</text><text x="105" y="326" text-anchor="middle" class="m" font-size="15">25 · 3 STRIPES</text></g>
    <g transform="translate(630 0)"><ellipse cx="105" cy="231" rx="92" ry="22" fill="#000" opacity=".6" filter="url(#shadow)"/><circle cx="105" cy="200" r="96" fill="#202126" stroke="#0a0a0b" stroke-width="15"/><circle cx="105" cy="200" r="79" fill="#121215" stroke="#aeb4b9" stroke-width="7"/><path d="M43 153h124M43 247h124M58 129h94M58 271h94" stroke="#8a8f94" stroke-width="7"/><circle cx="105" cy="200" r="56" fill="#141417" stroke="#f5f6f7" stroke-width="3"/><path d="M105 155a45 45 0 1 0 38 72" fill="none" stroke="#e2231a" stroke-width="10" stroke-linecap="round"/><text x="105" y="211" text-anchor="middle" class="v" font-size="25">100</text><text x="105" y="247" text-anchor="middle" class="play" font-size="11">PLAY</text><text x="105" y="326" text-anchor="middle" class="m" font-size="15">100 · 4 STRIPES</text></g>
    <g transform="translate(945 0)"><ellipse cx="105" cy="231" rx="92" ry="22" fill="#000" opacity=".6" filter="url(#shadow)"/><circle cx="105" cy="200" r="96" fill="#202126" stroke="#0a0a0b" stroke-width="15"/><circle cx="105" cy="200" r="79" fill="#302024" stroke="url(#red)" stroke-width="7"/><path d="M41 151h128M41 249h128M54 128h102M54 272h102" stroke="#ff4438" stroke-width="7"/><circle cx="105" cy="200" r="56" fill="#141417" stroke="#ff4438" stroke-width="3"/><path d="M105 155a45 45 0 1 0 38 72" fill="none" stroke="#f5c45e" stroke-width="10" stroke-linecap="round"/><text x="105" y="211" text-anchor="middle" class="v" font-size="25">500</text><text x="105" y="247" text-anchor="middle" class="play" font-size="11">PLAY</text><text x="105" y="326" text-anchor="middle" class="m" font-size="15">500 · 4 STRIPES</text></g>
  </g>
  <g transform="translate(158 535)">
    <g transform="translate(0 0)"><circle cx="105" cy="90" r="96" fill="#202126" stroke="#0a0a0b" stroke-width="15"/><circle cx="105" cy="90" r="79" fill="#351217" stroke="url(#red)" stroke-width="8"/><path d="M40 90h130M52 44h106M52 136h106M69 23h72M69 157h72" stroke="#ff4438" stroke-width="7"/><circle cx="105" cy="90" r="56" fill="#141417" stroke="#f5c45e" stroke-width="3"/><text x="105" y="101" text-anchor="middle" class="v" font-size="27">1K</text><text x="105" y="137" text-anchor="middle" class="play" font-size="11">PLAY</text><text x="105" y="216" text-anchor="middle" class="m" font-size="15">1K · 5 STRIPES</text></g>
    <g transform="translate(315 0)"><circle cx="105" cy="90" r="96" fill="#202126" stroke="#0a0a0b" stroke-width="15"/><circle cx="105" cy="90" r="79" fill="#261b26" stroke="#aeb4b9" stroke-width="8"/><path d="M40 90h130M52 44h106M52 136h106M69 23h72M69 157h72" stroke="#c8cdd0" stroke-width="7"/><circle cx="105" cy="90" r="56" fill="#141417" stroke="#e2231a" stroke-width="3"/><text x="105" y="101" text-anchor="middle" class="v" font-size="26">5K</text><text x="105" y="137" text-anchor="middle" class="play" font-size="11">PLAY</text><text x="105" y="216" text-anchor="middle" class="m" font-size="15">5K · 5 STRIPES</text></g>
    <g transform="translate(630 0)"><circle cx="105" cy="90" r="96" fill="#202126" stroke="#0a0a0b" stroke-width="15"/><circle cx="105" cy="90" r="79" fill="#2d1d24" stroke="url(#gold)" stroke-width="9"/><path d="M38 90h134M50 43h110M50 137h110M68 22h74M68 158h74M88 13h34M88 167h34" stroke="#f5c45e" stroke-width="7"/><circle cx="105" cy="90" r="56" fill="#141417" stroke="#f5c45e" stroke-width="3"/><text x="105" y="101" text-anchor="middle" class="v" font-size="24">25K</text><text x="105" y="137" text-anchor="middle" class="play" font-size="11">PLAY</text><text x="105" y="216" text-anchor="middle" class="m" font-size="15">25K · 6 STRIPES</text></g>
    <g transform="translate(945 0)"><circle cx="105" cy="90" r="96" fill="#202126" stroke="#0a0a0b" stroke-width="15"/><circle cx="105" cy="90" r="79" fill="#0e0e10" stroke="url(#gold)" stroke-width="9"/><path d="M38 90h134M50 43h110M50 137h110M68 22h74M68 158h74M88 13h34M88 167h34" stroke="#f5c45e" stroke-width="7"/><circle cx="105" cy="90" r="56" fill="#070708" stroke="#f5f6f7" stroke-width="3"/><path d="M105 50a41 41 0 1 0 35 66" fill="none" stroke="#e2231a" stroke-width="10" stroke-linecap="round"/><text x="105" y="101" text-anchor="middle" class="v" font-size="23">100K</text><text x="105" y="137" text-anchor="middle" class="play" font-size="11">PLAY</text><text x="105" y="216" text-anchor="middle" class="m" font-size="15">100K · PRESTIGE</text></g>
  </g>
  <text x="72" y="835" class="m" font-size="15">DENOMINATION IS ALWAYS REINFORCED BY NUMBER, COLOR, AND EDGE STRIPES — NEVER COLOR ALONE.</text>
</svg>
