  <g transform="translate(72 472)">
    <g transform="translate(0 0)"><rect width="278" height="230" rx="22" fill="#151316" stroke="#4a3035" stroke-width="2"/><text x="24" y="40" class="h" font-size="17">TROPHY</text><path d="M71 89v43c0 19 20 31 39 31s39-12 39-31V89" fill="none" stroke="#f5c45e" stroke-width="8"/><path d="M71 98H48c0 24 13 35 35 35M149 98h23c0 24-13 35-35 35" fill="none" stroke="#f5c45e" stroke-width="7"/><path d="M110 163v26M84 194h52" stroke="#e2231a" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="114" r="18" fill="#251a0d" stroke="#fff0b1" stroke-width="3"/><path d="M110 101a15 15 0 1 0 12 24" fill="none" stroke="#e2231a" stroke-width="5" stroke-linecap="round"/><text x="24" y="218" class="m" font-size="14">UNLOCKED · premium tier</text></g>
