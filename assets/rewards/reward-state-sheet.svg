    <g transform="translate(306 0)"><rect width="278" height="230" rx="22" fill="#151316" stroke="#4a3035" stroke-width="2"/><text x="24" y="40" class="h" font-size="17">LOGIN STREAK</text><circle cx="70" cy="114" r="46" fill="#241416" stroke="#e2231a" stroke-width="4"/><path d="M70 78c-8 18 6 22-11 34-19 14-8 39 11 39 26 0 34-32 17-50-5 13-16 13-17-23z" fill="#ff4438"/><text x="140" y="106" class="v" font-size="24">DAY 5</text><text x="140" y="133" class="m" font-size="14">STREAK</text><rect x="24" y="180" width="230" height="10" rx="5" fill="#34262a"/><rect x="24" y="180" width="164" height="10" rx="5" fill="#e2231a"/></g>
    <g transform="translate(612 0)"><rect width="278" height="230" rx="22" fill="#151316" stroke="#4a3035" stroke-width="2"/><text x="24" y="40" class="h" font-size="17">TOURNAMENT TICKET</text><path d="M39 84h145v62H39z" fill="#25191d" stroke="#f5c45e" stroke-width="4"/><path d="M55 84v62M168 84v62" stroke="#f5c45e" stroke-width="3" stroke-dasharray="5 7"/><path d="M112 99a20 20 0 1 0 0 40 20 20 0 0 0 0-40z" fill="none" stroke="#e2231a" stroke-width="5"/><path d="M112 108a11 11 0 1 0 9 19" fill="none" stroke="#ff4438" stroke-width="5" stroke-linecap="round"/><text x="24" y="191" class="m" font-size="14">VALID · event details external</text></g>
