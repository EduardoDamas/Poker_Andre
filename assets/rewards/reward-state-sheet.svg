<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840">
  <title>Reward and progression state sheet</title>
  <desc>Original play-money reward tiles in the client crimson, obsidian, silver, and champagne theme.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171517"/><stop offset="1" stop-color="#070708"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4438"/><stop offset=".5" stop-color="#e2231a"/><stop offset="1" stop-color="#9e1009"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b1"/><stop offset=".5" stop-color="#f5c45e"/><stop offset="1" stop-color="#a66b1a"/></linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
    <style>
      .h{font-family:Inter,Arial,sans-serif;fill:#f5f6f7;font-weight:800;letter-spacing:1.2px}
      .m{font-family:Inter,Arial,sans-serif;fill:#a7abb4;font-weight:500;letter-spacing:.7px}
      .v{font-family:Inter,Arial,sans-serif;fill:#f5f6f7;font-weight:900}
    </style>
  </defs>
  <rect width="1400" height="840" fill="url(#bg)"/>
  <rect x="30" y="30" width="1340" height="780" rx="30" fill="none" stroke="#3a3034" stroke-width="2"/>
  <text x="72" y="90" class="h" font-size="30">REWARDS &amp; PROGRESSION STATES</text>
  <text x="72" y="124" class="m" font-size="17">PLAY-MONEY ONLY · THEMED ICONS ARE LEGIBLE AT TILE SIZE AND DO NOT USE CASH SYMBOLS</text>

