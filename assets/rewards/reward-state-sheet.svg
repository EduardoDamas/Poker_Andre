    <g transform="translate(612 0)"><rect width="278" height="230" rx="22" fill="#151316" stroke="#4a3035" stroke-width="2"/><text x="24" y="40" class="h" font-size="17">REWARD CHEST</text><path d="M44 104h132v58H44z" fill="#261619" stroke="#e2231a" stroke-width="5"/><path d="M44 104c0-24 29-39 66-39s66 15 66 39" fill="#371216" stroke="#ff4438" stroke-width="5"/><rect x="98" y="111" width="24" height="35" rx="5" fill="#f5c45e" stroke="#fff0b1" stroke-width="2"/><path d="M78 77c18-16 47-16 65 0" fill="none" stroke="#f5c45e" stroke-width="4"/><text x="24" y="197" class="m" font-size="14">CLOSED / OPENING / OPEN</text></g>
    <g transform="translate(918 0)"><rect width="278" height="230" rx="22" fill="#151316" stroke="#4a3035" stroke-width="2"/><text x="24" y="40" class="h" font-size="17">LOCKED / CLAIMED</text><circle cx="75" cy="123" r="43" fill="#1b181b" stroke="#6e6265" stroke-width="4"/><rect x="54" y="119" width="42" height="33" rx="7" fill="#0e0d0f" stroke="#a7abb4" stroke-width="4"/><path d="M62 119v-14a13 13 0 0 1 26 0v14" fill="none" stroke="#a7abb4" stroke-width="4"/><circle cx="178" cy="123" r="43" fill="#1b181b" stroke="#e2231a" stroke-width="4"/><path d="M158 123l13 13 27-29" fill="none" stroke="#ff4438" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="197" class="m" font-size="14">SILHOUETTE + LOCK · CHECK SEAL</text></g>
