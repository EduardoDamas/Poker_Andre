# Builds the Android release APK on GitHub's servers — for when the dev machine
# can't run Gradle (Astrill's Winsock add-on crashes the JVM there, see
# docs/HANDOFF.md §8). Runs only when started by hand (Actions → Build APK →
# Run workflow, or the API). It runs the app tests, then builds.
#
# The APK it uploads is signed with a throwaway DEBUG key — it will NOT install
# over the players' app. Re-sign it locally with the release keystore (which
# never leaves the dev machine): see docs/HANDOFF.md §5.
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
